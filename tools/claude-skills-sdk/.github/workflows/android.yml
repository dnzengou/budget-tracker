name: Android APK (Tauri 2)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android NDK
        run: sdkmanager --install "ndk;26.1.10909125"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0" --locked
      - name: Init Android project
        working-directory: mobile
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: cargo tauri android init
      - name: Build APK
        working-directory: mobile
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: cargo tauri android build --apk
      - name: Compute sha256
        working-directory: mobile/gen/android/app/build/outputs/apk/universal/release
        run: |
          for f in *.apk; do
            sha256sum "$f" > "$f.sha256"
          done
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: |
            mobile/gen/android/app/build/outputs/apk/universal/release/*.apk
            mobile/gen/android/app/build/outputs/apk/universal/release/*.sha256
