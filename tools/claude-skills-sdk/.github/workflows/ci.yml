name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Sync skills into wheel
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip build pytest hatchling
          python -m build
          python -m pip install dist/*.whl
          python -m pytest tests/ -q

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - working-directory: sdk/js
        run: |
          npm install
          npm run prebuild
          npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - working-directory: cli
        run: |
          cargo build --release
          ./target/release/claude-skills list | grep -c kafca
          ./target/release/claude-skills compose rrss kafca | head -5

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.22" }
      - name: Sync skills into _skills (for embed)
        working-directory: sdk/go
        run: |
          mkdir -p _skills && cp ../../skills/*.md ../../skills/*.json _skills/
          go build ./...
