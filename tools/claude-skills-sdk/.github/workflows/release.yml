name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rust-binaries:
    name: Build CLI ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - name: Build
        working-directory: cli
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
        shell: bash
      - name: Package
        working-directory: cli
        shell: bash
        run: |
          NAME="claude-skills-${{ matrix.target }}"
          mkdir -p dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp target/${{ matrix.target }}/release/claude-skills.exe dist/$NAME.exe
            (cd dist && sha256sum $NAME.exe > $NAME.exe.sha256)
          else
            cp target/${{ matrix.target }}/release/claude-skills dist/$NAME
            (cd dist && shasum -a 256 $NAME > $NAME.sha256)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: cli/dist/*

  go-publish:
    name: Tag Go module
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - run: echo "Go module is fetched via tag — no action needed."

  python-publish:
    name: Publish Python to PyPI
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip build hatchling
          python -m build
      - name: Publish (skip if no token)
        if: env.PYPI_TOKEN != ''
        env: { PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }} }
        working-directory: sdk/python
        run: |
          python -m pip install twine
          python -m twine upload dist/* -u __token__ -p "$PYPI_TOKEN"

  npm-publish:
    name: Publish JS to npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - name: Build
        working-directory: sdk/js
        run: |
          npm install
          npm run prebuild
          npm run build
      - name: Publish (skip if no token)
        if: env.NPM_TOKEN != ''
        env: { NPM_TOKEN: ${{ secrets.NPM_TOKEN }}, NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} }
        working-directory: sdk/js
        run: npm publish --access public

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [rust-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: cli-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
