[package]
name = "claude-skills"
version = "0.1.0"
edition = "2021"
authors = ["dnzengou"]
license = "MIT"
description = "Distributable Claude skill bundle CLI — ARM, RRSS, KafCa, KafCade, DevFlow, Evolve."
repository = "https://github.com/dnzengou/claude-skills-sdk"
keywords = ["llm", "claude", "skills", "devflow", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "claude-skills"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
clap = { version = "4", features = ["derive"] }
