[package]
name = "claude-skills-mobile"
version = "0.1.0"
edition = "2021"
description = "Claude Skills mobile companion (Tauri 2 — Android + iOS + desktop)"
authors = ["dnzengou"]
license = "MIT"

[lib]
name = "claude_skills_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"

[[bin]]
name = "claude-skills-mobile"
path = "src/main.rs"
